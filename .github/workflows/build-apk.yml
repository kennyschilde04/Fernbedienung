name: APK bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/beamer-fernbedienung-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/beamer-fernbedienung.apk
          ls -la out

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: beamer-fernbedienung-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Release veröffentlichen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" out/*.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" out/*.apk \
              --title "Beamer Fernbedienung ${GITHUB_REF_NAME}" \
              --notes "APK zum direkten Installieren auf dem Handy."
          fi
